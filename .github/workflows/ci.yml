name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualite:
    name: Qualité (lint et typage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-manager-test-api
    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/taskmanager
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task-manager-test-api/package-lock.json

      - run: npm ci
      - name: Générer le client Prisma
        run: npx prisma generate
      - name: Linter
        run: npm run lint
      - name: Vérifier le typage TypeScript
        run: npx tsc --noEmit

  tests:
    name: Tests API
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: taskmanager
          MYSQL_ROOT_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: task-manager-test-api
    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/taskmanager
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: ci
      DATABASE_NAME: taskmanager
      API_VERSION: /api/v1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task-manager-test-api/package-lock.json

      - run: npm ci
      - name: Générer le client Prisma
        run: npx prisma generate
      - name: Appliquer les migrations Prisma
        run: npx prisma migrate deploy
      - name: Exécuter les tests
        run: npm test
